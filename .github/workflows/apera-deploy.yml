name: Deploy Apera AWS
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: apera-production-deployment
  cancel-in-progress: false
jobs:
  validate:
    uses: ./.github/workflows/apera-ci.yml
  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_REGION: ${{ vars.APERA_AWS_REGION }}
      HOSTED_ZONE_ID: ${{ vars.APERA_HOSTED_ZONE_ID }}
      HOSTED_ZONE_NAME: ${{ vars.APERA_HOSTED_ZONE_NAME }}
      API_DOMAIN: ${{ vars.APERA_API_DOMAIN }}
      API_COUNT: ${{ vars.APERA_API_COUNT || '1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.APERA_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.APERA_AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      - name: Validate infrastructure
        working-directory: infra
        run: npm ci && npm run build && npm test
      - name: Bootstrap resources only for a new stack
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOSTED_ZONE_ID" && test -n "$HOSTED_ZONE_NAME" && test -n "$API_DOMAIN"
          echo "APERA_NEW_STACK=false" >> "$GITHUB_ENV"
          if ! aws cloudformation describe-stacks --stack-name AperaProduction > /tmp/apera-stack.json 2>/tmp/apera-stack-error; then
            # Only absence permits creation; permission/network errors stop deployment.
            if ! grep -q 'does not exist' /tmp/apera-stack-error; then cat /tmp/apera-stack-error; exit 1; fi
            echo "APERA_NEW_STACK=true" >> "$GITHUB_ENV"
            (cd infra && npx cdk deploy -c bootstrap=true --require-approval never \
              --parameters HostedZoneId="$HOSTED_ZONE_ID" --parameters HostedZoneName="$HOSTED_ZONE_NAME" --parameters ApiDomain="$API_DOMAIN")
          fi
      - name: Read ECR destinations
        run: |
          aws cloudformation describe-stacks --stack-name AperaProduction > /tmp/apera-stack.json
          python3 - <<'PY'
          import json, os
          outputs={v['OutputKey']:v['OutputValue'] for v in json.load(open('/tmp/apera-stack.json'))['Stacks'][0]['Outputs']}
          with open(os.environ['GITHUB_ENV'],'a') as f:
              for role in ['api','worker']: f.write(f"{role.upper()}_REPOSITORY={outputs[role+'RepositoryUri']}\n")
          PY
      - name: Build immutable images
        shell: bash
        run: |
          set -euo pipefail
          for role in api worker; do
            key="${role^^}_REPOSITORY"; repository="${!key}"
            if ! aws ecr describe-images --repository-name "${repository#*/}" --image-ids imageTag="$GITHUB_SHA" >/dev/null 2>&1; then
              docker buildx build --platform linux/amd64 --file "Dockerfile.$role" --tag "$repository:$GITHUB_SHA" --push .
            fi
          done
      - name: Prepare queue, secrets and migration permissions without rolling applications
        if: env.APERA_NEW_STACK != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 deploy/scripts/prepare.py --image-tag "$GITHUB_SHA"
      - name: Run schema migration before services
        run: python3 deploy/scripts/migrate.py --image-tag "$GITHUB_SHA"
      - name: Roll out services
        working-directory: infra
        run: |
          npx cdk deploy --require-approval never \
            --parameters ImageTag="$GITHUB_SHA" \
            --parameters HostedZoneId="$HOSTED_ZONE_ID" --parameters HostedZoneName="$HOSTED_ZONE_NAME" \
            --parameters ApiDomain="$API_DOMAIN" \
            --parameters ApiCount="$API_COUNT"
      - name: Save release identity
        run: |
          for repository in "$API_REPOSITORY" "$WORKER_REPOSITORY"; do
            aws ecr describe-images --repository-name "${repository#*/}" --image-ids imageTag="$GITHUB_SHA" \
              --query 'imageDetails[0].{Tags:imageTags,Digest:imageDigest}' >> /tmp/apera-release.txt
          done
          cat /tmp/apera-release.txt >> "$GITHUB_STEP_SUMMARY"

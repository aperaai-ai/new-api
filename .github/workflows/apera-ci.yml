name: Apera validation
on:
  workflow_call:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ephemeral-test-password
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APERA_TEST_POSTGRES_DSN: postgres://postgres:ephemeral-test-password@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
      - uses: oven-sh/setup-bun@v2
      - name: Build embedded frontends
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          for theme in default classic; do
            (cd "web/$theme" && bun install --frozen-lockfile && bun run build)
          done
      - run: go test ./...
      - run: go test -race ./pkg/asyncprovider ./model ./service
  infrastructure:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - run: npm ci
      - run: npm run build && npm test && npx cdk synth --quiet
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        role: [api, worker]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.${{ matrix.role }}
          push: false
          cache-from: type=gha,scope=apera-${{ matrix.role }}
          cache-to: type=gha,mode=max,scope=apera-${{ matrix.role }}
